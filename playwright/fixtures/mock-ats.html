<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApplyOne Mock ATS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
        max-width: 720px;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      input,
      textarea {
        display: block;
        margin-top: 4px;
        width: 100%;
        padding: 8px;
      }
      button {
        margin-top: 16px;
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <h1>Junior IT Support Application</h1>
    <form>
      <label>Full name <input name="full_name" /></label>
      <label>Email <input name="email" type="email" /></label>
      <label>Phone <input name="phone" /></label>
      <label>Location <input name="location" /></label>
      <label>LinkedIn <input name="linkedin" /></label>
      <label>GitHub <input name="github" /></label>
      <label>Cover letter <textarea name="cover_letter"></textarea></label>
      <label>Resume <input name="resume" type="file" /></label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
