name = "applyone-worker"
main = "workers/src/index.ts"
compatibility_date = "2026-06-07"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-2.5-flash"

[secrets]
required = ["GEMINI_API_KEY", "OWNER_PASSWORD_HASH", "SESSION_SECRET", "ALLOWED_ORIGINS"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "applyone_db"
database_name = "applyone-db"
database_id = "242e9bcc-0ef2-47fb-8824-53380c1a977a"
